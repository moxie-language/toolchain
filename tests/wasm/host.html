<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>moxie wasm host</title></head>
<body>
<script type="module">
  // Minimal host page: loads a Moxie wasm module through jsruntime/loader.mjs
  // and captures its stdout. The module's putchar writes one byte per
  // fd_write call, so bytes are accumulated into lines here.
  const log = [];
  let line = '';
  window.__logs = log;
  window.__done = false;
  window.__error = null;
  const errors = [];
  window.__consoleErrors = errors;
  console.log = (...a) => {
    for (const x of a) line += String(x);
    // Flush complete lines as they arrive. A module returns from _start and is
    // then driven by the page, so some of its output happens AFTER load()
    // resolves; a single blob flushed at the end would lose every late line.
    let i;
    while ((i = line.indexOf('\n')) >= 0) { log.push(line.slice(0, i + 1)); line = line.slice(i + 1); }
  };
  console.error = (...a) => { errors.push(a.map(String).join(' ')); };
  window.addEventListener('error', e => { window.__error = String(e.message); });
  // The generic panic action calls this hook after it has stopped every domain
  // (see jsruntime/host.mjs). A panic-test fixture reads it as the proof that
  // the action ran, not merely that a message was printed.
  window.__moxie_panic = (reason) => { window.__panicReason = String(reason); };
  // This page is the TEST host: ask jsruntime/host.mjs for load-only stubs for
  // import namespaces a fixture may LINK but never call (gojs). A production
  // page does not set it, so the same module fails loudly there instead.
  globalThis.__moxie_test_stubs = true;
  const params = new URLSearchParams(location.search);
  try {
    // ?host=<url> loads an EMITTED bundle host (the page bootstrap `moxie build
    // -target wasm` writes beside the module, with its own $runtime/ copy), so
    // the harness can run the scaffolding a real app would ship rather than the
    // repository's own jsruntime/. Without it, the repository loader.
    const host = params.get('host');
    const app = params.get('app');
    if (host) {
      const m = await import(host);
      await m.start();
    } else if (!params.get('bundle')) {
      // A page that starts a second bundle is a supervisor, not the host of a
      // root module: loading /app.wasm as well would run whatever fixture was
      // copied there last.
      const { load } = await import('/jsruntime/loader.mjs');
      // ?app=<url> names the bundle's own bridge module, for a fixture that
      // imports symbols only its application can answer.
      await load('/app.wasm', app ? { appBridge: app } : {});
    }
  } catch (e) {
    window.__error = String((e && e.stack) || e);
  }
  // ?bundle=<url> starts a SECOND bundle through the runtime staged beside it,
  // the way an app starts its store or feed worker: the page keeps the port, the
  // bundle's bridge answers it, and both directions are checked.
  const bundleUrl = params.get('bundle');
  if (bundleUrl) {
    try {
      const abs = new URL(bundleUrl, location.href).href;
      const runtimeHost = new URL('./$runtime/host.mjs', abs).href;
      const { startBundle } = await import(runtimeHost);
      const b = startBundle(abs, { appBridge: params.get('bridge') || null });
      b.port.onmessage = (e) => {
        window.__bundle = { got: String(e.data) };
        b.port.postMessage('hello-from-page');
      };
      await b.ready;
    } catch (e) {
      window.__bundleError = String((e && e.stack) || e);
    }
  }
  // ?sw=<url> registers the emitted service worker through the bundle's own
  // registration glue, and waits for it to activate before reporting the page
  // loaded: a worker that never activates is a failed boot, not a slow one.
  const swUrl = new URLSearchParams(location.search).get('sw');
  if (swUrl) {
    try {
      await new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = swUrl;
        s.onload = resolve;
        s.onerror = () => { window.__swError = 'registration script did not load'; resolve(); };
        document.head.appendChild(s);
      });
      // Poll the registrations rather than awaiting navigator.serviceWorker.ready:
      // ready() is scoped to THIS document, and the page lives outside the
      // worker's scope in this harness, so it would never resolve even with the
      // worker activated. A worker that never activates must also not hang the
      // run - the driver waits for __done - so the poll has a deadline and
      // reports the state it reached.
      const deadline = Date.now() + 25000;
      let state = 'timeout';
      let scope = '';
      for (;;) {
        const regs = await navigator.serviceWorker.getRegistrations();
        const r = regs[0];
        if (r) {
          scope = r.scope;
          if (r.active && r.active.state === 'activated') { state = 'activated'; break; }
        }
        if (Date.now() >= deadline) break;
        await new Promise((res) => setTimeout(res, 200));
      }
      const regs = await navigator.serviceWorker.getRegistrations();
      window.__sw = {
        state: state,
        scope: scope,
        regs: regs.map((r) => ({
          scope: r.scope,
          installing: r.installing ? r.installing.state : null,
          waiting: r.waiting ? r.waiting.state : null,
          active: r.active ? r.active.state : null,
        })),
      };
    } catch (e) {
      window.__swError = String((e && e.stack) || e);
    }
  }
  if (line) log.push(line);
  window.__done = true;
</script>
</body>
</html>
