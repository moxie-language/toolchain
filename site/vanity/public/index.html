<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The vanity import path. `go get`/`go list` fetch this URL with ?go-get=1 and
  read this tag; it must be on the page the import path resolves to, and the
  answer must be a 200 (a redirect breaks module resolution).
-->
<meta name="go-import" content="moxielang.dev git https://github.com/moxie-language/toolchain.git">
<!-- A browser lands here too: send it to the repository, with a visible link in
     case the redirect is blocked or the reader wants to know where it went. -->
<meta http-equiv="refresh" content="0; url=https://github.com/moxie-language/toolchain">
<title>moxielang.dev — the Moxie toolchain</title>
<style>
:root { color-scheme: light dark }
body { font: 16px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 3rem auto; max-width: 46rem; padding: 0 1.25rem }
a { color: inherit }
code { background: color-mix(in srgb, currentColor 10%, transparent); padding: .1em .3em; border-radius: .2em }
</style>
</head>
<body>
<h1>moxielang.dev</h1>
<p>The Moxie toolchain lives at
<a href="https://github.com/moxie-language/toolchain">github.com/moxie-language/toolchain</a>.</p>
<p>This address is a vanity import root: <code>import "moxielang.dev/pkg/mxutil"</code>
resolves to that repository. The page you are reading is the <code>?go-get=1</code>
discovery document; a browser is redirected to the repository.</p>
<script>location.replace("https://github.com/moxie-language/toolchain");</script>
</body>
</html>
